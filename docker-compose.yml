version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pos_pizza_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_pizza
    ports:
      - "5432:5432"
    volumes:
      - pos_pizza_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pos_pizza_pgdata:
